[package]
name = "zapfast-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reusable egui UI primitives inspired by ZapFast"
repository = "https://github.com/Areo-RGB/zapfast"

[lib]
name = "zapfast_ui"
path = "src/lib.rs"

[[example]]
name = "gallery"
path = "examples/gallery.rs"

[dependencies]
egui = "0.36.2"

[dev-dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
